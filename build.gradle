plugins {
    id 'java-library'
    id 'maven-publish'
}
group = 'za.co.fnb.dcre'
version = '0.1.0'
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}
repositories { mavenCentral(); mavenLocal() }
dependencies {
    api 'za.co.fnb.dcre:platform-files:0.1.0'
    compileOnly 'org.springframework.boot:spring-boot:4.1.0'
    compileOnly 'org.springframework.boot:spring-boot-autoconfigure:4.1.0'
    // springBatchVersion lives in gradle.properties: it is guarded, see the note there.
    compileOnly "org.springframework.batch:spring-batch-core:${springBatchVersion}"
    compileOnly "org.springframework.batch:spring-batch-infrastructure:${springBatchVersion}"
    compileOnly 'org.springframework:spring-tx:7.0.8'
    compileOnly 'org.springframework:spring-jdbc:7.0.8'
    compileOnly 'org.springframework.boot:spring-boot-jdbc:4.1.0'
    compileOnly 'org.slf4j:slf4j-api:2.0.17'

    testImplementation platform('org.springframework.boot:spring-boot-dependencies:4.1.0')
    testImplementation 'org.springframework.boot:spring-boot'
    testImplementation 'org.springframework.boot:spring-boot-autoconfigure'
    testImplementation 'org.springframework.boot:spring-boot-test'
    testImplementation "org.springframework.batch:spring-batch-core:${springBatchVersion}"
    testImplementation 'org.assertj:assertj-core'
    testImplementation 'org.yaml:snakeyaml'

    // SCRUM-84 persistent-JDBC-JobRepository IT: real Boot batch autoconfig
    // (the Resourceless default, for the RED baseline) + a JDBC DataSource +
    // Testcontainers CockroachDB. Testcontainers is NOT BOM-managed on Boot 4.
    testImplementation 'org.springframework.boot:spring-boot-starter-batch'
    testImplementation 'org.springframework.boot:spring-boot-starter-jdbc'
    testImplementation 'org.testcontainers:cockroachdb:1.21.4'
    testRuntimeOnly 'org.postgresql:postgresql'

    testImplementation platform('org.junit:junit-bom:6.0.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test { useJUnitPlatform() }
publishing { publications { maven(MavenPublication) { from components.java } } }
