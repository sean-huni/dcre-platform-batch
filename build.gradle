plugins {
    id 'java-library'
    id 'maven-publish'
}
group = 'za.co.fnb.dcre'
version = '0.1.0'
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}
repositories { mavenCentral(); mavenLocal() }
// Inline literal, deliberately NOT in gradle.properties: that file holds exactly ONE entry,
// springBatchVersion, because that one is guarded by PortalSafeOverrideGuardTest and its header
// says so. Every other version in this module is an inline literal in this file.
ext.otelLogbackAppenderVersion = '2.28.1-alpha'
dependencies {
    api 'za.co.fnb.dcre:platform-files:0.1.0'
    compileOnly 'org.springframework.boot:spring-boot:4.1.0'
    compileOnly 'org.springframework.boot:spring-boot-autoconfigure:4.1.0'
    // springBatchVersion lives in gradle.properties: it is guarded, see the note there.
    compileOnly "org.springframework.batch:spring-batch-core:${springBatchVersion}"
    compileOnly "org.springframework.batch:spring-batch-infrastructure:${springBatchVersion}"
    compileOnly 'org.springframework:spring-tx:7.0.8'
    compileOnly 'org.springframework:spring-jdbc:7.0.8'
    compileOnly 'org.springframework.boot:spring-boot-jdbc:4.1.0'
    compileOnly 'org.slf4j:slf4j-api:2.0.17'

    // [!CONVENTION-OVERRIDE] Every other framework dependency here is compileOnly, so this library
    // forces no runtime version on its 30 consumers. Telemetry cannot honour that: an exporter that
    // is only on the compile classpath exports nothing. The alternative is the same four lines
    // hand-copied into 30 build files, which is the shape that produced nine divergent copies of one
    // class on this fleet on 2026-09-04. One version, one place, one bump.
    //
    // micrometer-registry-otlp is api and NOT runtimeOnly, and THE REASON RECORDED FOR THAT HAS
    // LAPSED. The Task 1 spike (2026-09-11) measured that a runtimeOnly registry cannot be compiled
    // against ("package io.micrometer.registry.otlp does not exist"), and it was made api so Task
    // 4's flush could compile. The same spike then proved there is no flush to write, and Task 4
    // compiles against nothing here: `grep -rn "io.micrometer" src/` exits 1 with zero hits against
    // a positive control returning 5. A consumer sees no difference either way, because Gradle puts
    // runtimeOnly into runtimeElements too; the scopes differ only in what can COMPILE against the
    // registry. Left as api rather than churning 30 consumers' resolved compile classpaths for no
    // behavioural change. Anything here that ever does reach the registry types on
    // PushMeterRegistry from micrometer-core, never on OtlpMeterRegistry: a cast to the latter
    // throws in any service carrying a composite registry.
    //
    // The three unpinned coordinates in the brief carry inline literals here because this module
    // applies no BOM to its main configurations. 4.1.0 and 1.17.0 are the versions the
    // spring-boot-dependencies:4.1.0 BOM manages (micrometer.version=1.17.0), read from the BOM.
    api 'org.springframework.boot:spring-boot-starter-actuator:4.1.0'
    api 'org.springframework.boot:spring-boot-starter-opentelemetry:4.1.0'
    api "io.opentelemetry.instrumentation:opentelemetry-logback-appender-1.0:${otelLogbackAppenderVersion}"
    api 'io.micrometer:micrometer-registry-otlp:1.17.0'

    testImplementation platform('org.springframework.boot:spring-boot-dependencies:4.1.0')
    testImplementation 'org.springframework.boot:spring-boot'
    testImplementation 'org.springframework.boot:spring-boot-autoconfigure'
    testImplementation 'org.springframework.boot:spring-boot-test'
    testImplementation "org.springframework.batch:spring-batch-core:${springBatchVersion}"
    testImplementation 'org.assertj:assertj-core'
    testImplementation 'org.yaml:snakeyaml'

    // SCRUM-84 persistent-JDBC-JobRepository IT: real Boot batch autoconfig
    // (the Resourceless default, for the RED baseline) + a JDBC DataSource +
    // Testcontainers CockroachDB. Testcontainers is NOT BOM-managed on Boot 4.
    testImplementation 'org.springframework.boot:spring-boot-starter-batch'
    testImplementation 'org.springframework.boot:spring-boot-starter-jdbc'
    testImplementation 'org.testcontainers:cockroachdb:1.21.4'
    // A-80: the stale-lock releaser is wired as a BeanPostProcessor on the bean NAMED
    // 'liquibase'. That name is an assumption about Boot's autoconfiguration, so the wiring
    // test boots a real context with real Liquibase rather than asserting the releaser alone.
    testImplementation 'org.springframework.boot:spring-boot-liquibase'
    testImplementation 'org.liquibase:liquibase-core'
    testRuntimeOnly 'org.postgresql:postgresql'

    testImplementation platform('org.junit:junit-bom:6.0.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test {
    useJUnitPlatform()
    // ExitCodeMainForkIT forks a real JVM to observe a real process exit code
    // (a seam unit test would pass while production still exits 1). Gradle runs
    // its workers off a manifest-only jar, so java.class.path in the worker is
    // not the test classpath: hand the child the real one. Absent, the IT skips.
    systemProperty 'dcre.fork.classpath', sourceSets.test.runtimeClasspath.asPath
}
publishing { publications { maven(MavenPublication) { from components.java } } }
