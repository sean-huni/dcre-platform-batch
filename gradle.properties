# SCRUM-101. ONE literal for spring-batch-core/-infrastructure, deliberately, because it is
# guarded. PortalSafeStepExecutionDao and PortalSafeJobRepositoryFactoryBean were written by
# reading this exact release's sources line by line, and PortalSafeOverrideGuardTest fails the
# build when the resolved version moves off it. That guard only works if the compile pin and the
# test pin cannot drift apart: compileOnly does not feed the test classpath, so two separate
# literals would let a compile-side bump slip past the guard.
#
# Bumping this is not a routine version bump. Re-read both overrides against the new sources
# (getLastStepExecution, getStepExecution(long), createStepExecutionDao, determineClobTypeToUse),
# re-check every line number they cite, re-run PortalSafeStepExecutionDaoIT, and only then move
# VERIFIED_AGAINST in PortalSafeOverrideGuardTest.
springBatchVersion=6.0.4
